name: Prepare Windows test downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-local-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test apps/desktop/test/*.test.cjs
      - run: node --import tsx --test apps/api/test/local-client-identity.test.ts
      - run: npm run package:windows:portable -w @corewaste/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: python3 scripts/package-firebase-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: CoreWaste-Firebase-Windows-0.2.0-x64-UNSIGNED
          path: |
            .local/firebase-download/*.zip
            .local/firebase-download/*.sha256
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - run: bash scripts/build-local-test-images.sh
      - run: node scripts/package-windows-test-kit.cjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/start-local-test-verification.cjs
      - run: node scripts/verify-local-test-kit.mjs
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ""
      - run: node scripts/stop-local-test-verification.cjs --remove-disposable-volumes
        if: always()
      - run: python3 scripts/archive-windows-test-kit.py .local/windows-download/CoreWaste-Windows-Local-Test-0.2.0-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CoreWaste-Windows-Local-Test-0.2.0-x64-UNSIGNED
          path: |
            .local/windows-download/*.zip
            .local/windows-download/*.sha256
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test apps/desktop/test/*.test.cjs
      - run: npm run package:windows -w @corewaste/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: CoreWaste-Windows-Hosted-Client-Installer-UNSIGNED
          path: .local/windows-test/*.exe
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

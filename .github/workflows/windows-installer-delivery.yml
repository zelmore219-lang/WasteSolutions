name: Windows installer download
on:
  push:
    branches: [codex/windows-installer-download]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test apps/desktop/test/*.test.cjs
      - run: npm run package:windows:portable -w @corewaste/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: python3 scripts/build-windows-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: CoreWaste-Windows-Installer-0.2.0-x64-UNSIGNED
          path: |
            .local/firebase-installer/CoreWaste-Setup-0.2.0-x64.exe
            .local/firebase-installer/CoreWaste-Setup-0.2.0-x64.exe.sha256
            .local/firebase-installer/START-HERE.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
